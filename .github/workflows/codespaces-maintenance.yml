name: Maintain Codespaces safely
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inventory, probe, export, delete]
        default: inventory
      target_fingerprint:
        type: string
        required: false
      verified_export_sha:
        type: string
        required: false
      verified_last_used_at:
        type: string
        required: false
      current_branch_only_confirmed:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: codespaces-maintenance
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect only the Daily Food Diary Codespaces
        if: inputs.operation == 'inventory'
        env:
          GH_CODESPACES_TOKEN: ${{ secrets.GH_CODESPACES_TOKEN }}
        run: node maintenance/inspect-codespaces.mjs
      - name: Privately inspect a verified stopped Codespace
        if: inputs.operation == 'probe'
        env:
          GH_CODESPACES_TOKEN: ${{ secrets.GH_CODESPACES_TOKEN }}
          CODESPACE_FINGERPRINT: ${{ inputs.target_fingerprint }}
        run: node maintenance/probe-codespace.mjs
      - name: Recover the current branch without starting the Codespace
        if: inputs.operation == 'export'
        env:
          GH_CODESPACES_TOKEN: ${{ secrets.GH_CODESPACES_TOKEN }}
          CODESPACE_FINGERPRINT: ${{ inputs.target_fingerprint }}
        run: node maintenance/export-codespace.mjs
      - name: Delete only an explicitly confirmed and verified exported space
        if: inputs.operation == 'delete'
        env:
          GH_CODESPACES_TOKEN: ${{ secrets.GH_CODESPACES_TOKEN }}
          GH_REPOSITORY_TOKEN: ${{ github.token }}
          CODESPACE_FINGERPRINT: ${{ inputs.target_fingerprint }}
          VERIFIED_EXPORT_SHA: ${{ inputs.verified_export_sha }}
          VERIFIED_LAST_USED_AT: ${{ inputs.verified_last_used_at }}
          CURRENT_BRANCH_ONLY_CONFIRMED: ${{ inputs.current_branch_only_confirmed }}
        run: node maintenance/delete-exported-codespace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-codespaces-inspection
          path: codespaces-inspection/*.encrypted.json
          if-no-files-found: ignore
          retention-days: 3
